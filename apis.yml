aid: sorare
name: Sorare
description: >-
  Sorare is a global fantasy sports platform for football (soccer), NBA basketball and
  MLB baseball built on blockchain-based digital collectible player cards stored on
  Ethereum and a StarkWare rollup. Its public developer surface is a single GraphQL API
  at https://api.sorare.com/graphql covering cards, users, auctions, offers and real-time
  subscriptions. The API supports JWT authentication (via the signIn mutation, with TOTP
  2FA), OAuth 2.0 (Authorization Code and Client Credentials), and optional API keys for
  elevated rate limits, plus StarkWare payload signing for on-chain trading actions.
